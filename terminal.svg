<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D00FF" />
      <stop offset="50%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#00FF00" />
    </linearGradient>
  </defs>
  <style>
    .bg { fill: #0d1117; stroke: #00FFFF; stroke-width: 3px; }
    .text { font-family: 'Consolas', 'Courier New', monospace; font-size: 14px; fill: #e6edf3; white-space: pre; }
    .prompt-user { fill: #ff7b72; font-weight: bold; }
    .prompt-dir { fill: #79c0ff; font-weight: bold; }
    .prompt-arrow { fill: #ff7b72; font-weight: bold; }
    .cmd { fill: #a5d6ff; }
    .ascii { fill: url(#neonGradient); font-weight: bold; }
    .info { fill: #00FFFF; }
    
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    
    .line { opacity: 0; animation: fadeIn 0.1s forwards; }
    
    /* Staggered animations */
    .l1 { animation-delay: 0.5s; }
    .l2 { animation-delay: 1.5s; }
    
    .l3 { animation-delay: 2.0s; }
    .l4 { animation-delay: 2.1s; }
    .l5 { animation-delay: 2.2s; }
    .l6 { animation-delay: 2.3s; }
    .l7 { animation-delay: 2.4s; }
    .l8 { animation-delay: 2.5s; }
    
    /* Typing effect for info lines */
    .l9 { animation-delay: 3.5s; }
    .l10 { animation-delay: 4.5s; }
    .l11 { animation-delay: 5.5s; }
    .l12 { animation-delay: 6.5s; }
    
    .l13 { animation-delay: 8.0s; }
    .l14 { animation-delay: 8.5s; }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor { animation: blink 1s step-end infinite; fill: #e6edf3; }
  </style>

  <!-- Terminal Window Background -->
  <rect class="bg" width="100%" height="100%" rx="10" />
  
  <!-- Terminal Window Header -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />
  <text class="text" x="300" y="25" text-anchor="middle" fill="#8b949e" font-size="12px">edi@EdiW7:~</text>
  <line x1="0" y1="35" x2="600" y2="35" stroke="#30363d" stroke-width="1" />

  <g class="text" transform="translate(20, 70)">
    <g class="line l1">
      <rect x="0" y="-15" width="45" height="20" fill="#9D00FF" />
      <text x="22" y="0" fill="#000000" font-weight="bold" text-anchor="middle">edi</text>
      <rect x="45" y="-15" width="80" height="20" fill="#00FFFF" />
      <polygon points="45,-15 55,-5 45,5" fill="#9D00FF" />
      <text x="90" y="0" fill="#000000" font-weight="bold" text-anchor="middle">~/EdiW7</text>
      <polygon points="125,-15 135,-5 125,5" fill="#00FFFF" />
    </g>
    <text class="line l2" y="25"><tspan fill="#39FF14" font-weight="bold">❯</tspan> <tspan class="cmd">./welcome.sh</tspan></text>
    
    <text class="line l3 ascii" y="60"> __          __  _                            </text>
    <text class="line l4 ascii" y="80"> \ \        / / | |                           </text>
    <text class="line l5 ascii" y="100">  \ \  /\  / /__| | ___ ___  _ __ ___   ___  </text>
    <text class="line l6 ascii" y="120">   \ \/  \/ / _ \ |/ __/ _ \| '_ ` _ \ / _ \ </text>
    <text class="line l7 ascii" y="140">    \  /\  /  __/ | (_| (_) | | | | | |  __/ </text>
    <text class="line l8 ascii" y="160">     \/  \/ \___|_|\___\___/|_| |_| |_|\___| </text>

    <text class="line l9" y="200"><tspan class="info">[+] Name      :</tspan> Edi Wicoro</text>
    <text class="line l10" y="225"><tspan class="info">[+] Role      :</tspan> Fullstack &amp; QA Engineer</text>
    <text class="line l11" y="250"><tspan class="info">[+] Location  :</tspan> Batang, Central Java</text>
    <text class="line l12" y="275"><tspan class="info">[+] Status    :</tspan> Online</text>
    
    <g class="line l13" transform="translate(0, 315)">
      <rect x="0" y="-15" width="45" height="20" fill="#9D00FF" />
      <text x="22" y="0" fill="#000000" font-weight="bold" text-anchor="middle">edi</text>
      <rect x="45" y="-15" width="80" height="20" fill="#00FFFF" />
      <polygon points="45,-15 55,-5 45,5" fill="#9D00FF" />
      <text x="90" y="0" fill="#000000" font-weight="bold" text-anchor="middle">~/EdiW7</text>
      <polygon points="125,-15 135,-5 125,5" fill="#00FFFF" />
    </g>
    <text class="line l14" y="340"><tspan fill="#39FF14" font-weight="bold">❯</tspan> <tspan class="cursor">█</tspan></text>
  </g>
</svg>
